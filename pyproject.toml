[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.5,<2", "pyarrow>=18", "httpx>=0.27,<1", "boto3>=1.35,<2", "holidays>=0.90,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
research-lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
